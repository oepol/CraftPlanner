plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = '1.1.0+mc26.3'
group = 'dev.ole.craftplanner'
base { archivesName = 'craftplanner' }
repositories { mavenCentral(); maven { url 'https://maven.terraformersmc.com/' } }
loom {
    splitEnvironmentSourceSets()
    mods { craftplanner { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'com.terraformersmc:modmenu:21.0.0'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def modVersion = project.version
processResources { inputs.property 'version', modVersion; filesMatching('fabric.mod.json') { expand version: modVersion } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }

jar { from("LICENSE") { rename { "LICENSE_craftplanner" } } }
